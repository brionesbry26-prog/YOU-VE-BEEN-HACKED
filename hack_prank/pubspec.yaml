name: hack_prank
description: "You've Been Hacked 😂 — a harmless, fully offline cinematic hacking prank."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2
  # Package versions below are the newest releases that support Flutter 3.35.
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  audioplayers: ^6.7.1
  camera: ^0.12.0
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  gal: ^2.3.3
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  vibration: ^3.1.8
  wakelock_plus: ^1.4.0

dev_dependencies:
  fake_async: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  # Fonts are bundled (SIL Open Font License, see assets/fonts/OFL-*.txt) so the
  # app never needs a network connection.
  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
